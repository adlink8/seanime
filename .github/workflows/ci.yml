name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    name: Go test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build server
        run: go build -tags=nosystray ./...

      - name: Run Go tests
        run: go test ./... -count=1

  web-check:
    name: Frontend typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seanime-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seanime-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run
