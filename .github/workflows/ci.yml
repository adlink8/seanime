name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-check:
    name: Frontend typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seanime-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seanime-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      # web/ 是 go:embed 依赖的生成产物（被 gitignore），在此构建并传给 Go job
      - name: Build frontend
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: seanime-web/out
          retention-days: 1

  go-test:
    name: Go test & build
    needs: web-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build server
        run: go build ./...

      - name: Run Go tests
        run: go test ./... -count=1
